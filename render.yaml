services:
  # =========================================================
  # VESTRA BACKEND (FastAPI + Uvicorn Web Service)
  # =========================================================
  - type: web
    name: vestra-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VESTRA_ENV
        value: production
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TWgbh1ZXPMo4pl
      - key: RAZORPAY_KEY_SECRET
        value: 3V9I3xWuBc56nFbhH4yOD4Ej
      - key: DATABASE_URL
        value: sqlite:///./vestra.db

  # =========================================================
  # VESTRA FRONTEND (React + Vite Static Site)
  # =========================================================
  - type: web
    name: vestra-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_RAZORPAY_KEY_ID
        value: rzp_test_TWgbh1ZXPMo4pl
      - key: VITE_API_URL
        sync: false
